<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="quality-results-title quality-results-desc" style="font-family:Arial,sans-serif" id="quality-results-root"><title id="quality-results-title">Constrained generation resolved unsupported wording</title><desc id="quality-results-desc">The chart compares reference-substitution rates for the same 130 V2 scenario-mode cases under two serving policies.</desc><defs>
