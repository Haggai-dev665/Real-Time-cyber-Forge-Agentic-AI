text><text x="479.0" y="420" font-size="15" fill="#5C5550" font-weight="400" text-anchor="middle"><tspan x="479.0" dy="0">25%</tspan></text><text x="610.0" y="420" font-size="15" fill="#5C5550" font-weight="400" text-anchor="middle"><tspan x="610.0" dy="0">50%</tspan></text><text x="741.0" y="420" font-size="15" fill="#5C5550" font-weight="400" text-anchor="middle"><tspan x="741.0" dy="0">75%</tspan></text><text x="872.0" y="420" font-size="15" fill="#5C5550" font-weight="400" text-anchor="middle"><tspan x="872.0" dy="0">100%</tspan></text><text x="32" y="474" font-size="22" fill="#1F1A1B" font-weight="600" text-anchor="start"><tspan x="32" dy="0">84 / 87 risk labels match the authored target (96.55%).</tspan></text><text x="32" y="510" font-size="17" fill="#5C5550" font-weight="400" text-anchor="start"><tspan x="32" dy="0">130 / 130 constrained factual/support checks passed; both model versions passed.</tspan></text><line x1="32" y1="540" x2="928" y2="540" stroke="#C9C1B5"/><text x="32" y="566" font-size="15" fill="#5C5550" font-weight="400" text-anchor="start"><tspan x="32" dy="0">Same V2 weights. Serving controls changed. These are not measurements of unaided recall or URL accuracy.</tspan></text></svg>
