[package]
name = "cyberforge-cli"
version = "1.0.0"
description = "The cyberforge command-line interface"
authors = ["CyberForge"]
license = "MIT"
edition = "2021"
# The MCP server (rmcp 3.5) needs Rust 1.88.
rust-version = "1.88"
workspace = "../../desktop/src-tauri"

[[bin]]
name = "cyberforge"
path = "src/main.rs"

[dependencies]
cyberforge-core = { path = "../cyberforge-core" }
cyberforge-mcp = { path = "../cyberforge-mcp" }
# Pinned exactly: the parser defines the command surface and its exit code 2
# for usage errors. 4.5.61 is the last of the 4.5 line (Rust 1.74+).
clap = { version = "=4.5.61", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time", "signal"] }
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false }
# Hidden password entry in a terminal. Pinned: 7.3.1 needs Rust 1.60; later
# releases need 1.85, above this workspace's floor.
rpassword = "=7.3.1"
