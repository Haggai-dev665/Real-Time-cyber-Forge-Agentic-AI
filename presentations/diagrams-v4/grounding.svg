<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img" aria-labelledby="grounding-title grounding-desc" style="font-family:Arial,sans-serif" id="grounding-root"><title id="grounding-title">Reference-grounded inference at runtime</title><desc id="grounding-desc">Current-question retrieval selects reviewed passages for constrained decoding, while uncovered questions use ordinary generation.</desc><defs>
      <style>#grounding-root { color: #1F1A1B; font-family: Arial,sans-serif; }
      #grounding-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#grounding-root .diagram-container { overflow-x:visible }
}</style><marker id="grounding-grounding-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5C5550"/></marker>
        <marker id="grounding-grounding-inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="9" markerHeight="9" orient="auto"><path d="M 1 1 L 11 6 L 1 11 z" fill="white" stroke="#5C5550"/></marker></defs><rect width="960" height="720" fill="#FFFFFF"/><path d="M 480 172 L 480 212" fill="none" stroke="#5C5550" stroke-width="1.8" marker-end="url(#grounding-grounding-arrow)"/><path d="M 304 272 H 244 Q 236 272 236 280 V 376" fill="none" stroke="#5C5550" stroke-width="1.8" marker-end="url(#grounding-grounding-arrow)"/><rect x="231.5" y="237" width="41" height="22" fill="#FFFFFF"/><text x="252" y="252" font-size="13" fill="#5C5550" font-weight="400" text-anchor="middle"><tspan x="252" dy="0">YES</tspan></text><path d="M 656 272 H 740 Q 748 272 748 280 V 376" fill="none" stroke="#5C5550" stroke-width="1.8" marker-end="url(#grounding-grounding-arrow)"/><rect x="684.0" y="237" width="40" height="22" fill="#FFFFFF"/><text x="704" y="252" font-size="13" fill="#5C5550" font-weight="400" text-anchor="middle"><tspan x="704" dy="0">NO</tspan></text><path d="M 236 488 L 236 548" fill="none" stroke="#5C5550" stroke-width="1.8" marker-end="url(#grounding-grounding-arrow)"/><path d="M 748 488 L 748 548" fill="none" stroke="#5C5550" stroke-width="1.8" marker-end="url(#grounding-grounding-arrow)"/><text x="32" y="40" font-size="27" fill="#1F1A1B" font-weight="600" text-anchor="start"><tspan x="32" dy="0">Reference-grounded inference at runtime</tspan></text><text x="32" y="70" font-size="13" fill="#5C5550" font-weight="400" text-anchor="start"><tspan x="32" dy="0">CYBERFORGE  /  IMPLEMENTATION REVIEW · 23 OCTOBER 2026</tspan></text><ellipse cx="480.0" cy="138.0" rx="192.0" ry="34.0" fill="#FAF8F3" stroke="#5C5550" stroke-width="1.6"/><text x="480.0" y="136" font-size="21" fill="#1F1A1B" font-weight="600" text-anchor="middle"><tspan x="480.0" dy="0">Current question</tspan></text><polygon points="480,212 656,272 480,332 304,272" fill="#FFF3E3" stroke="#5C5550" stroke-width="1.6"/><text x="480" y="266" font-size="20" fill="#1F1A1B" font-weight="600" text-anchor="middle"><tspan x="480" dy="0">Reviewed topic</tspan><tspan x="480" dy="27.0">matched?</tspan></text><rect x="32" y="376" width="408" height="112" rx="6" fill="#FFF3E3" stroke="#98601B" stroke-width="1.6"/><text x="48" y="406" font-size="21" fill="#1F1A1B" font-weight="600" text-anchor="start"><tspan x="48" dy="0">Constrained passage selection</tspan></text><text x="48" y="436" font-size="17" fill="#5C5550" font-weight="400" text-anchor="start"><tspan x="48" dy="0">Qwen chooses reviewed full sentences</tspan><tspan x="48" dy="23.0">13-topic library · at most 2 references</tspan></text><rect x="568" y="376" width="360" height="112" rx="6" fill="#FAF8F3" stroke="#5C5550" stroke-width="1.6"/><text x="584" y="406" font-size="21" fill="#1F1A1B" font-weight="600" text-anchor="start"><tspan x="584" dy="0">Ordinary Qwen generation</tspan></text><text x="584" y="436" font-size="17" fill="#5C5550" font-weight="400" text-anchor="start"><tspan x="584" dy="0">Uses permitted context</tspan><tspan x="584" dy="23.0">Can still hallucinate</tspan></text><rect x="32" y="548" width="408" height="80" rx="6" fill="#FAF8F3" stroke="#5C5550" stroke-width="1.6"/><text x="48" y="578" font-size="21" fill="#1F1A1B" font-weight="600" text-anchor="start"><tspan x="48" dy="0">Check wording + expose sources</tspan></text><text x="48" y="608" font-size="17" fill="#5C5550" font-weight="400" text-anchor="start"><tspan x="48" dy="0">Explicit reference replacement if needed</tspan></text><rect x="568" y="548" width="360" height="80" rx="6" fill="#FAF8F3" stroke="#5C5550" stroke-width="1.6"/><text x="584" y="578" font-size="21" fill="#1F1A1B" font-weight="600" text-anchor="start"><tspan x="584" dy="0">Preserve engine attribution</tspan></text><text x="584" y="608" font-size="17" fill="#5C5550" font-weight="400" text-anchor="start"><tspan x="584" dy="0">No claim of general verification</tspan></text><line x1="32" y1="660" x2="928" y2="660" stroke="#C9C1B5"/><text x="32" y="686" font-size="15" fill="#5C5550" font-weight="400" text-anchor="start"><tspan x="32" dy="0">Primary-source links are shown in chat. This is bounded extraction, not unrestricted factual reasoning.</tspan></text></svg>
