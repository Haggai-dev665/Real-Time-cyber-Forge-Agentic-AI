# The CyberForge backend with its own MongoDB and Redis, for local development.
#
#   1. cp backend/.env.example backend/.env   and set JWT_SECRET (32+ random bytes;
#      the backend refuses to start on a placeholder) and the keys you use.
#   2. docker compose up --build
#   3. http://localhost:8000/health
#
# NOT RUN YET: written on a machine without Docker. A test checks that every
# path this file names exists (backend/tests/contracts/compose.test.js); the
# containers themselves have not been started. Treat the first run as the test.
#
# What is deliberately not here:
#   - The ML service. The backend calls the hosted one (ML_SERVICE_URL in
#     backend/.env, or the built-in default). ML code is not run locally.
#   - The desktop and mobile apps. They are built natively: see desktop/BUILD.md.
#   - A reverse proxy and TLS. This is for development, not for deployment;
#     the deployed backend runs on Heroku (backend/scripts/deploy-heroku.js).
#
# The previous version of this file described a different system: PostgreSQL
# (the backend uses MongoDB), a backend Dockerfile, a landing-page folder and an
# nginx configuration that did not exist, and a signing secret the backend rejects.

services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      # These three replace whatever backend/.env says, so the container talks
      # to the two services above and not to a hosted database.
      PORT: "8000"
      DATABASE_URL: mongodb://mongo:27017/cyberforge
      REDIS_URL: redis://redis:6379
    ports:
      - "8000:8000"
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

volumes:
  mongo_data:
